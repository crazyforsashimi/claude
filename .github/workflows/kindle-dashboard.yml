name: Kindle 行情看板

on:
  schedule:
    # 美东常规时段每 15 分钟刷新一次（UTC；覆盖夏令时 EDT 与冬令时 EST 两种偏移）
    # EDT: 09:30–16:00 ET = 13:30–20:00 UTC ； EST = 14:30–21:00 UTC
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:   # 允许在 Actions 页手动 Run workflow

permissions:
  contents: write        # 把生成的 kindle/index.html 提交回仓库

concurrency:
  group: kindle-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成看板
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python gen_kindle.py    # 仅用标准库，无需 pip install
      - name: 提交看板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kindle/index.html
          git diff --staged --quiet && exit 0          # 无变化则不提交
          git commit -m "chore: 刷新 Kindle 看板 [skip ci]"
          git pull --rebase --autostash origin main || true
          git push
